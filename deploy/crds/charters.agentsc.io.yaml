                  redact:
                    type: array
                    description: Dotted paths inside `input`/`output` replaced by "[redacted]".
                    items:
                      type: string
                x-kubernetes-preserve-unknown-fields: true
              telemetry:
                type: object
                description: OpenTelemetry export and what audit leaves the pod. Absent = the defaults.
                properties:
                  otlp_endpoint:
                    type: string
                    description: |-
                      OTLP/HTTP endpoint, `http(s)://host[:port]` with no path, query or fragment. Honoured only
