# Generated by `agentsc charter schema --crd` from the Rust charter types; do not edit.
# A test keeps this file in sync: cargo run -q -p agentsc-cli -- charter schema --crd > deploy/crds/charters.agentsc.io.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: charters.agentsc.io
  labels:
    app.kubernetes.io/part-of: agentsc
spec:
  group: agentsc.io
  names:
    kind: Charter
    listKind: CharterList
    plural: charters
    singular: charter
    categories:
    - agentsc
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Service
      type: string
      jsonPath: .spec.service.name
    - name: Version
      type: string
      jsonPath: .status.appliedVersion
    - name: Valid
      type: string
      jsonPath: .status.conditions[?(@.type=="Valid")].status
    - name: Synced
      type: string
      jsonPath: .status.conditions[?(@.type=="Synced")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        description: 'Charter: the agents and policy of one service, applied by its agentsc sidecars.'
        x-kubernetes-preserve-unknown-fields: true
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            description: The charter of one service (CONTRACT.md §3) without apiVersion and kind. metadata.name must equal service.name; service.namespace defaults to metadata.namespace.
            properties:
              service:
                type: object
                description: |-
                  The service, as in the plain charter except that `namespace` is optional (it defaults to
                  `metadata.namespace`).
                properties:
                  name:
                    type: string
                    description: DNS-1123 label; must equal `metadata.name`.
                  namespace:
                    type: string
                    description: Defaults to `metadata.namespace`; if given, must equal it.
                    nullable: true
                  app_port:
                    type: integer
                    description: Port the app container listens on (localhost), target of inbound service invocations.
                    minimum: 0
                    maximum: 65535
                  service_accounts:
                    type: array
                    description: |-
                      Kubernetes service accounts whose pods may obtain this identity, besides `<service.name>`
                      (default: `[<service.name>]`).
                    items:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                required:
                - name
                - app_port
                x-kubernetes-preserve-unknown-fields: true
              mesh:
                type: object
                properties:
                  port:
                    type: integer
                    minimum: 0
                    maximum: 65535
