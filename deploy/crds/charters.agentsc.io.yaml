                            pattern: ^[a-zA-Z0-9_-]{1,64}$
                          description:
                            type: string
                          type:
                            type: string
                            enum:
                            - service
                            - agent
                            - http
                          parameters:
                            description: JSON Schema object describing the tool input. Defaults per CONTRACT.md §3.1.
                            x-kubernetes-preserve-unknown-fields: true
                          service:
                            type: string
                            description: |-
                              `service` tools: target service. `agent` tools: remote service (omit for local). A service
                              of this charter's namespace is `<service>`; one in another namespace is
                              `<service>.<namespace>` (charter schema level 5).
                            nullable: true
                          method:
                            type: string
                            nullable: true
                          path:
                            type: string
                            nullable: true
                          agent:
                            type: string
                            nullable: true
                          url:
                            type: string
                            nullable: true
                          label:
                            type: string
                            description: |-
                              Label of what this tool returns (taint policy). Default: `untrusted` for `http` tools,
                              `trusted` for `service` and `agent` tools.
                            enum:
                            - trusted
                            - untrusted
                            - sensitive
                            nullable: true
                          effect:
                            type: string
                            description: |-
                              What the call does (taint policy). Default from the method: GET, HEAD and OPTIONS read,
                              everything else writes; `agent` tools read (the callee's sidecar enforces its own policy).
                            enum:
                            - read
                            - write
                            nullable: true
                        required:
                        - name
                        - description
                        - type
                        x-kubernetes-preserve-unknown-fields: true
                    budgets:
                      type: object
                      properties:
                        max_tokens_per_call:
                          type: integer
                          minimum: 0
                        max_calls_per_minute:
                          type: integer
                          minimum: 0
                        max_cost_usd_per_day:
                          type: number
                        max_steps:
                          type: integer
                          minimum: 0
                      x-kubernetes-preserve-unknown-fields: true
                    skills:
                      type: array
                      description: Names of top-level `skills` this agent uses, each at most once.
                      items:
                        type: string
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                    harness:
                      type: object
                      description: Retries, timeouts and the fallback model. Absent = the defaults.
                      properties:
                        max_retries:
                          type: integer
                          description: Retries of a model call after a retryable failure, 0..=10.
                          minimum: 0
                          maximum: 10
                        request_timeout_seconds:
                          type: integer
                          description: SDK timeout of each attempt, 1..=600 seconds.
                          minimum: 1
                          maximum: 600
                        fallback_model:
                          type: string
                          description: |-
                            Model tried once after the last retryable failure; a valid model id other than `model`
                            (the `model` rules: not empty, no whitespace or control characters, at most 128 bytes).
                          nullable: true
                          maxLength: 128
                          pattern: ^[^\s\x00-\x1f\x7f-\x9f]+$
                        tool_result_max_chars:
                          type: integer
                          description: Tool results are cut to this many characters, 100..=200000.
                          minimum: 100
                          maximum: 200000
                      x-kubernetes-preserve-unknown-fields: true
                      nullable: true
                    learning:
                      type: object
                      description: Governed learning. Absent = off.
                      properties:
                        enabled:
                          type: boolean
                        mode:
                          type: string
                          description: '`auto` requires `enabled: true`.'
                          enum:
                          - review
                          - auto
                        max_notes:
                          type: integer
                          description: Active notes kept for the agent, 1..=200.
                          minimum: 1
                          maximum: 200
                        max_note_chars:
                          type: integer
                          description: Longest note, 50..=4000 characters.
                          minimum: 50
                          maximum: 4000
                        note_ttl_days:
                          type: integer
                          description: Lifetime of an `auto` note, 1..=365 days.
                          minimum: 1
                          maximum: 365
                        from_peers:
                          type: boolean
                          description: Also reflect on invocations whose caller is a peer service.
                        max_proposals_per_hour:
                          type: integer
                          description: Lessons the agent may propose per hour, 1..=100.
                          minimum: 1
                          maximum: 100
                      x-kubernetes-preserve-unknown-fields: true
                      nullable: true
                    taint:
                      type: object
                      description: Taint-aware policy (docs/design/taint-policy.md). Absent = off.
                      properties:
                        mode:
                          type: string
                          description: |-
                            `enforce` denies a call a rule forbids; `audit` allows it and records what would have been
                            denied (rule `taint.would_deny.<rule>`), for trying a policy on real traffic first.
                          enum:
                          - enforce
                          - audit
                        input:
                          type: string
                          description: |-
                            Label of the invocation's own input. `trusted` (the default) for an authenticated
                            caller's request; `untrusted` when the input itself is third-party text.
                          enum:
                          - trusted
                          - untrusted
                          - sensitive
                      x-kubernetes-preserve-unknown-fields: true
                      nullable: true
                  required:
                  - name
                  - model
                  x-kubernetes-preserve-unknown-fields: true
              guardrails:
                type: object
                properties:
                  max_input_bytes:
                    type: integer
                    minimum: 0
                  pii_redact:
                    type: boolean
                  input_deny:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        regex:
                          type: string
                      required:
                      - name
                      - regex
                      x-kubernetes-preserve-unknown-fields: true
                  output_deny:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        regex:
                          type: string
                      required:
                      - name
                      - regex
                      x-kubernetes-preserve-unknown-fields: true
                  allowed_tools:
                    type: object
                    description: 'agent → tool names it may use (default: every tool it declares).'
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                  allowed_services:
                    type: object
                    description: 'agent → services it may call (default: every service its tools name).'
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                x-kubernetes-preserve-unknown-fields: true
              authz:
                type: object
                properties:
                  default:
                    type: string
                    enum:
                    - allow
                    - deny
                  callers:
                    type: array
                    items:
                      type: object
                      properties:
                        identity:
                          type: string
                          description: '`local` (the app container) or a SPIFFE ID.'
                        agents:
                          type: array
                          description: Agent names, or `"*"`.
                          items:
                            type: string
                        caller_agents:
                          type: array
                          description: |-
                            Calling agents (the `x-agentsc-agent` claim of the caller's sidecar) this rule admits.
