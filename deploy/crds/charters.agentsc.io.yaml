                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Valid or Synced.
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              memory:
                type: object
                description: The service's memory (version and notes per agent).
                x-kubernetes-preserve-unknown-fields: true
              proposals:
                description: Learning proposals of the service's agents.
                x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
