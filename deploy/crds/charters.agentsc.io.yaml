                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      enum:
                      - agent
                      - orchestrator
                    model:
                      type: string
                      description: |-
                        A Claude model id (e.g. `claude-opus-5-5`) or `mock`: not empty, no whitespace or control
                        characters, at most 128 bytes.
                      maxLength: 128
                      pattern: ^[^\s\x00-\x1f\x7f-\x9f]+$
                    system:
                      type: string
                      description: System prompt, at most 32768 bytes.
                      maxLength: 32768
                    tools:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: |-
                              The name the model sees, unique per agent: `^[a-zA-Z0-9_-]{1,64}$`, and never
