apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
    agentsc.io/service: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        agentsc.io/service: inventory
      annotations:
        agentsc.io/inject: "false"
    spec:
      containers:
        - name: app
          image: agentsc/inventory:dev
          imagePullPolicy: IfNotPresent
          # No container port: the app listens on 127.0.0.1 only and is reached through the sidecar.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }
        - name: agentscd
          image: agentsc/agentscd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: mesh
              containerPort: 50002
          env:
            - name: AGENTSC_CHARTER
              value: /etc/agentsc/charter/charter.yaml
            - name: AGENTSC_TLS_DIR
              value: /etc/agentsc/tls
            - name: RUST_LOG
              value: info
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentsc-anthropic
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: charter
              mountPath: /etc/agentsc/charter
              readOnly: true
            - name: tls
              mountPath: /etc/agentsc/tls
              readOnly: true
            - name: run
              mountPath: /run/agentsc
          readinessProbe:
            exec:
              command: ["agentsc-ready"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["agentsc-ready"]
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      volumes:
        - name: charter
          configMap:
            name: inventory-charter
        - name: tls
          secret:
            secretName: agentsc-cert-inventory
        - name: run
          emptyDir: {}
