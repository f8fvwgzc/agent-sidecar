apiVersion: v1
kind: Service
metadata:
  name: inventory
  labels:
    app: inventory
    agentsc.io/service: inventory
spec:
  selector:
    app: inventory
  # Only the mesh port: other pods reach inventory's app solely through its sidecar's mTLS + authz.
  ports:
    - name: mesh
      port: 50002
      targetPort: mesh
