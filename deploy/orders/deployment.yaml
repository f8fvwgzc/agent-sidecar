apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
    agentsc.io/service: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        agentsc.io/service: orders
      annotations:
        agentsc.io/inject: "false"   # injection is explicit in the MVP: the sidecar is written out below
    spec:
      containers:
        - name: app
          image: agentsc/orders:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENTSC_URL
              value: http://127.0.0.1:3500
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        - name: agentscd
          image: agentsc/agentscd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: mesh
              containerPort: 50002
          env:
            - name: AGENTSC_CHARTER
              value: /etc/agentsc/charter/charter.yaml
            - name: AGENTSC_TLS_DIR
              value: /etc/agentsc/tls
            - name: RUST_LOG
              value: info
            # Without the Secret's key, run the demo agents on the mock model instead of refusing them.
            - name: AGENTSC_MOCK_FALLBACK
              value: "1"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentsc-anthropic
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: charter
              mountPath: /etc/agentsc/charter
              readOnly: true
            - name: tls
              mountPath: /etc/agentsc/tls
              readOnly: true
            - name: run
              mountPath: /run/agentsc
          readinessProbe:
            exec:
              command: ["agentsc-ready"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["agentsc-ready"]
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      volumes:
        - name: charter
          configMap:
            name: orders-charter
        - name: tls
          secret:
            secretName: agentsc-cert-orders
        - name: run
          emptyDir: {}
