{{- /*
RBAC as design §13, plus `delete` on charters: §10 DELETE /services/{ns}/{svc} (admin) has the
kubernetes store delete the service's Charter (§8.4 "delete service"; its ControllerRevisions go
with it through their owner reference), which §13's verb list leaves out. ClusterRole
attache-embassy is bound to both control-plane service accounts. The Secret Role is bound to embassy-ca only, so embassy-ca is the only workload that can
read the CA key; embassy reads embassy-tls, the config and the session key as mounted volumes.
No ConfigMap permissions anywhere.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attache-embassy
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
rules:
  - apiGroups: ["attache.io"]
    resources: ["charters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["attache.io"]
    resources: ["charters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: [{{ include "agent-sidecar.injectorName" . | quote }}, {{ include "agent-sidecar.validatorName" . | quote }}]
    verbs: ["get", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attache-embassy
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: attache-embassy
subjects:
  - kind: ServiceAccount
    name: embassy-ca
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: embassy
    namespace: {{ .Release.Namespace }}
---
# Secrets in the control-plane namespace: the CA (attache-ca), the serving certificate that
# embassy-ca creates and renews (embassy-tls) and the session key. Kubernetes cannot restrict
# `create` by resourceNames (the name is not known when a create is authorized), so `create` is a
# separate rule without names: embassy-ca can create any Secret in this namespace, but read and
# update only these three.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attache-embassy-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "agent-sidecar.caSecretName" . }}
      - {{ include "agent-sidecar.tlsSecretName" . }}
      - {{ include "agent-sidecar.sessionKeySecretName" . }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attache-embassy-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: attache-embassy-secrets
subjects:
  - kind: ServiceAccount
    name: embassy-ca
    namespace: {{ .Release.Namespace }}
{{- with .Values.ca.existingSecret }}
{{- $ref := splitList "/" . }}
{{- if ne (len $ref) 2 }}
{{- fail "ca.existingSecret must be <namespace>/<name>" }}
{{- end }}
---
# ca.existingSecret: read-only access to that one CA Secret (embassy-ca never creates a CA then).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attache-embassy-existing-ca
  namespace: {{ index $ref 0 }}
  labels:
    {{- include "agent-sidecar.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ index $ref 1 | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attache-embassy-existing-ca
  namespace: {{ index $ref 0 }}
  labels:
    {{- include "agent-sidecar.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: attache-embassy-existing-ca
subjects:
  - kind: ServiceAccount
    name: embassy-ca
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# For users. Writing a Charter is equivalent to the attache admin role for that service: the
# validating webhook checks it, but no role-on-diff check applies to kubectl.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attache-charter-view
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregate }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- end }}
rules:
  - apiGroups: ["attache.io"]
    resources: ["charters", "charters/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attache-charter-edit
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregate }}
    {{- range .Values.rbac.charterEditAggregatesTo }}
    rbac.authorization.k8s.io/aggregate-to-{{ . }}: "true"
    {{- end }}
    {{- end }}
rules:
  - apiGroups: ["attache.io"]
    resources: ["charters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["attache.io"]
    resources: ["charters/status"]
    verbs: ["get", "list", "watch"]
