{{- /*
No caBundle here, ever: embassy-ca patches both configurations whenever their caBundle differs from
the serving certificate's CA (every 30 s). Until then the API server cannot reach the webhooks, so
injection in labelled namespaces and Charter writes wait for embassy-ca (failurePolicy Fail).

Each configuration has exactly one webhook entry, named sidecar-injector.agentsc.io and
charter-validator.agentsc.io (the design names only the configurations). The caBundle reconciler
must set every entry it reads from the live object (a strategic-merge patch keyed on another name
would add an entry instead); the names are in the README's "What embassy-ca reads from the chart".
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "agent-sidecar.injectorName" . }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
webhooks:
  - name: sidecar-injector.agentsc.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    reinvocationPolicy: Never
    failurePolicy: {{ .Values.injection.failurePolicy }}
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: embassy-ca
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    objectSelector:
      matchLabels:
        agentsc.io/inject: "true"
    namespaceSelector:
      matchExpressions:
        - key: agentsc.io/injection
          operator: In
          values: ["enabled"]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", {{ .Release.Namespace | quote }}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "agent-sidecar.validatorName" . }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
webhooks:
  - name: charter-validator.agentsc.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: embassy-ca
        namespace: {{ .Release.Namespace }}
        path: /validate-charter
        port: 443
    rules:
      - apiGroups: ["agentsc.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["charters"]
        scope: Namespaced
