{{- if .Values.networkPolicy.enabled }}
# Connect (15012) stays open to sidecars in every namespace; the API/UI (8080) admits only
# networkPolicy.httpFrom (none by default). Probes from the node and kubectl port-forward are not
# subject to it. With networkPolicy.egress, embassy may only reach DNS, the API server (and other
# https), tutelad when the `tutela` section is set, and networkPolicy.egressExtra.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embassy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.componentLabels" (dict "root" $ "component" "embassy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-sidecar.selectorLabels" (dict "root" $ "component" "embassy") | nindent 6 }}
  policyTypes: {{ ternary (list "Ingress" "Egress") (list "Ingress") .Values.networkPolicy.egress | toJson }}
  ingress:
    - ports:
        - port: 15012
          protocol: TCP
    {{- with .Values.networkPolicy.httpFrom }}
    - ports:
        - port: 8080
          protocol: TCP
        {{- if $.Values.embassy.http3 }}
        - port: 8080
          protocol: UDP
        {{- end }}
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Kubernetes API server (the store, TokenReview), and https to OIDC issuers.
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- if .Values.tutela }}
    # tutelad (ControlPlaneConfig `tutela`): the admin API, token exchange and its token endpoint.
    - ports:
        - port: {{ .Values.networkPolicy.tuteladPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.tuteladTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egressExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
