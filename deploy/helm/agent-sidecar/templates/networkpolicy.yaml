{{- if .Values.networkPolicy.enabled }}
# Connect (15012) stays open to sidecars in every namespace; the API/UI (8080) admits only
# networkPolicy.httpFrom (none by default). Probes from the node and kubectl port-forward are not
# subject to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embassy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.componentLabels" (dict "root" $ "component" "embassy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-sidecar.selectorLabels" (dict "root" $ "component" "embassy") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 15012
          protocol: TCP
    {{- with .Values.networkPolicy.httpFrom }}
    - ports:
        - port: 8080
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
