apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-sidecar.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "agent-sidecar.controlPlaneConfig" . | nindent 4 }}
{{- if not .Values.auth.sessionKey.existingSecret }}
{{- $name := include "agent-sidecar.sessionKeySecretName" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $live $live.data (hasKey $live.data "key") }}
{{- $key = index $live.data "key" }}
{{- else }}
{{- $key = randAlphaNum 64 | b64enc }}
{{- end }}
---
# The HMAC key for session cookies (64 random alphanumerics). Kept across upgrades: the live value is
# reused when the Secret exists.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sidecar.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ $key }}
{{- end }}
