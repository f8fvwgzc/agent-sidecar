# Tutela service mode (docs/operations.md "Agents in tutelad"): the tutela section, its two
# Secrets, and a NetworkPolicy that restricts embassy's egress to tutelad's pods.
tutela:
  credentials: /etc/agentsc/tutela
  url: https://tutela.tutela.svc:8080
  private_host: true
  agent_tokens:
    issuer: https://agentsc.example.com
    key_file: /etc/agentsc/tutela-agent/key.pem
tutelaCredentials:
  existingSecret: attache-tutela
tutelaAgentKey:
  existingSecret: attache-tutela-agent
networkPolicy:
  enabled: true
  egress: true
  tuteladTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tutela
      podSelector:
        matchLabels:
          app.kubernetes.io/name: tutela
          app.kubernetes.io/component: server
