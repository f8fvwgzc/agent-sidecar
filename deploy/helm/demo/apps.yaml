# The v0.2 demo apps for `make demo-helm`. No sidecar container here: the pod label
# attache.io/inject: "true" makes the agent-sidecar webhook add the attached native sidecar, the
# annotations name the service and app port, and the charters come from the Charter resources
# (attache charter to-cr examples/charters/<svc>.charter.yaml). Each pod runs as a service account
# named like its service, which is what IssueCertificate accepts without service.service_accounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: attache-demo
  labels:
    app: orders
    attache.io/service: orders
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: attache-demo
  labels:
    app: inventory
    attache.io/service: inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: attache-demo
  labels:
    app: orders
    attache.io/service: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        attache.io/service: orders   # `attache logs` selects on it
        attache.io/inject: "true"
      annotations:
        attache.io/service: orders
        attache.io/app-port: "8080"
    spec:
      serviceAccountName: orders
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: attache/orders:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ATTACHE_URL
              value: http://127.0.0.1:3500
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: attache-demo
  labels:
    app: inventory
    attache.io/service: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        attache.io/service: inventory
        attache.io/inject: "true"
      annotations:
        attache.io/service: inventory
        attache.io/app-port: "8000"
    spec:
      serviceAccountName: inventory
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: attache/inventory:dev
          imagePullPolicy: IfNotPresent
          # No container port: the app listens on 127.0.0.1 only and is reached through the sidecar.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: attache-demo
  labels:
    app: orders
    attache.io/service: orders
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The injected attached container's mesh port (by number: it lives in an init container).
    - name: mesh
      port: 50002
      targetPort: 50002
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: attache-demo
  labels:
    app: inventory
    attache.io/service: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: mesh
      port: 50002
      targetPort: 50002
