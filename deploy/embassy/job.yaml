apiVersion: batch/v1
kind: Job
metadata:
  name: embassy-bootstrap
  labels:
    agentsc.io/component: embassy
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        agentsc.io/component: embassy
    spec:
      serviceAccountName: embassy
      restartPolicy: OnFailure
      containers:
        - name: embassy
          image: agentsc/embassy:dev
          imagePullPolicy: IfNotPresent
          args: ["bootstrap", "--namespace", "agentsc-demo", "--services", "orders,inventory"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
