apiVersion: v1
kind: ServiceAccount
metadata:
  name: embassy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embassy-pki
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embassy-pki
subjects:
  - kind: ServiceAccount
    name: embassy
roleRef:
  kind: Role
  name: embassy-pki
  apiGroup: rbac.authorization.k8s.io
