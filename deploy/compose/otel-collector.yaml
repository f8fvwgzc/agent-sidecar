# OpenTelemetry collector for the Compose stack: the sidecars export OTLP/HTTP JSON
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318); traces go on to Jaeger, metrics to the
# collector's own log (docker compose logs otel-collector).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
