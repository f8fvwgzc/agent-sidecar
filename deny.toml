# Supply-chain policy, checked by `cargo deny check` in CI (blocking).
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unsound, unmaintained) and every yanked version fails the
# check. Accept one only with an entry here: `{ id = "RUSTSEC-…", reason = "why it does not apply, and until when" }`.
yanked = "deny"
unsound = "all"
# An unmaintained crate fails only as a direct dependency; deeper ones are reported by `cargo audit`.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.26 comes only with agentscd's opt-in `profiling` feature (pprof 0.15 -> inferno 0.11,
    # no release with a newer quick-xml yet). inferno only writes the flamegraph SVG; both advisories
    # are in the reader. Release builds never enable the feature. Keep in sync with .cargo/audit.toml.
    { id = "RUSTSEC-2026-0194", reason = "reader only; pprof/inferno write SVG, profiling builds only" },
    { id = "RUSTSEC-2026-0195", reason = "NsReader only; pprof/inferno write SVG, profiling builds only" },
]

[licenses]
# Permissive licences only. Add one here only after reading it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# inferno (CDDL-1.0, file-level copyleft) is linked only into agentscd's opt-in `profiling` build,
# which is never released.
[[licenses.exceptions]]
crate = "inferno"
allow = ["CDDL-1.0"]

[licenses.private]
# Workspace crates are not published; they carry no licence of their own to check.
ignore = true

[bans]
# Duplicate versions are common across the async ecosystem and are not a supply-chain risk.
multiple-versions = "allow"
# Workspace crates depend on each other by path, without a version; crates.io refuses `*` on publish.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
