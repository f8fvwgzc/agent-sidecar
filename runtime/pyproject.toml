[project]
name = "attache-runtime"
version = "0.1.0"
description = "attache agent runtime: executes charter-declared agents next to a service, every tool call through the sidecar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "grpcio>=1.70.0",
    "protobuf>=5.29.0",
    "pydantic>=2.10.0",
]

[project.scripts]
attache-runtime = "attache_runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attache_runtime"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.70.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/attache_runtime/pb"]
