name: Feature request
description: Suggest a new capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should agent-sidecar do? Show a charter snippet or a request if it helps.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Effect on CONTRACT.md
      description: Which part of the wire protocol, charter or audit record would change?
