name: Bug report
description: Something does not work as the docs or CONTRACT.md say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: charter
    attributes:
      label: Charter
      description: The charter you used, or the smallest one that shows the problem. Remove secrets.
      render: yaml
  - type: textarea
    id: audit
    attributes:
      label: Audit records or logs
      description: The audit lines for the request (agentsc logs --trace <id>) and any sidecar errors. Remove secrets.
      render: text
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you tested (git rev-parse --short HEAD).
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - make local-demo (no Kubernetes)
        - minikube
        - other Kubernetes
        - other
    validations:
      required: true
