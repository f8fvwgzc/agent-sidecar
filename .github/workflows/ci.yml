# The testing gates of CONTRACT.md §10 that run without a cluster, plus formatting and drift checks
# for the generated files that are committed (charter JSON Schema, Python gRPC stubs).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test, schema drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # agentsc-proto's build script runs protoc (via tonic-prost-build).
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: schemas/charter.schema.json matches the Rust types
        run: |
          make schema
          if ! git diff --exit-code -- schemas/charter.schema.json; then
            echo "::error file=schemas/charter.schema.json::out of date; run 'make schema' and commit the result"
            exit 1
          fi

  python:
    name: Python runtime (ruff, pytest, stub drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Fail instead of rewriting runtime/uv.lock when it is out of date with pyproject.toml.
      UV_LOCKED: "1"
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
          cache-python: true

      - name: uv sync
        run: uv sync

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: pytest
        run: uv run pytest -q

      # grpcio-tools bundles its own protoc, so this job needs no system protoc.
      - name: Python gRPC stubs match proto/
        working-directory: .
        run: |
          make proto
          pb=runtime/src/agentsc_runtime/pb
          if [ -n "$(git status --porcelain -- "$pb")" ]; then
            git status --short -- "$pb"
            git diff -- "$pb"
            echo "::error file=$pb::stubs are out of date with proto/ or grpcio-tools; run 'make proto' and commit the result"
            exit 1
          fi

  # CONTRACT.md §10's one-machine gate: both demo apps, two sidecars with embassy certificates over mTLS,
  # and the real runtime on the mock model. The script fails when the stock question does not cross
  # the mesh, the admin reset is not denied by inventory's charter, or the guardrail lets a secret in.
  local-demo:
    name: Local demo (two sidecars over mTLS, mock model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      # The runtime calls the Anthropic API when this is set; the gate runs the deterministic mock,
      # which it must ask for: without a key a Claude model is refused.
      ANTHROPIC_API_KEY: ""
      AGENTSC_MOCK_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # examples/orders uses only the standard library: nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/orders/go.mod
          cache: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
          cache-python: true
          cache-suffix: local-demo

      - name: make local-demo
        run: make local-demo

      - name: Demo logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in .local/logs/*; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Blocking: a new advisory against a dependency fails CI until the dependency is fixed, or the
  # advisory is accepted with a reason in deny.toml and .cargo/audit.toml.
  audit:
    name: Dependency audit (cargo-deny, cargo-audit, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      # Advisories, licences, bans and sources, per deny.toml.
      - name: cargo deny check
        run: cargo deny --locked check

      - name: cargo audit
        if: ${{ !cancelled() }}
        run: cargo audit

      - name: pip-audit
        if: ${{ !cancelled() }}
        working-directory: runtime
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  platform-demo:
    name: Platform demo (embassy one-process, managed sidecars, live edit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      # The runtime calls the Anthropic API when this is set; the gate runs the deterministic mock,
      # which it must ask for: without a key a Claude model is refused.
      ANTHROPIC_API_KEY: ""
      AGENTSC_MOCK_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # examples/orders uses only the standard library: nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/orders/go.mod
          cache: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
          cache-python: true
          cache-suffix: platform-demo

      - name: make platform-demo
        run: make platform-demo

      - name: Demo logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in .local/platform/logs/*; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
