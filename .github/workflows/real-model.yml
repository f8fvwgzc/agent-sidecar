# The real model path (CONTRACT.md §4.4, §9): agentscd with the Anthropic key, the real runtime,
# and the real API through the sidecar's model gateway. Streaming, tool_use parsing, 429 / 529 and
# mid-stream overloads (retried by the harness), a refusal and a stalled stream at the deadline
# (the last four injected by a proxy in front of the API: runtime/tests/live/test_real_model.py).
#
# Runs nightly and by hand, and only when the repository secret ANTHROPIC_API_KEY exists. The key
# reaches the agentscd process alone; the test checks that the runtime process does not have it.
# The charter caps the run's spend at $1 a day, which the gateway enforces.
name: Real model

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id the live agent uses
        required: false
        default: claude-opus-5-5
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: real-model
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  key:
    name: Is ANTHROPIC_API_KEY set?
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the repository secret ANTHROPIC_API_KEY is not set: the real-model tests did not run"
          fi

  live:
    name: Real model (agentscd + runtime + Anthropic API)
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
      AGENTSC_LIVE: "1"
      AGENTSC_LIVE_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      AGENTSC_LIVE_LOGS: ${{ github.workspace }}/.local/live
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build -p agentscd
        run: cargo build -p agentscd --locked

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
          cache-python: true
          cache-suffix: real-model

      - name: uv sync
        working-directory: runtime
        run: uv sync

      - name: Live tests
        working-directory: runtime
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -v tests/live

      - name: Audit logs and sidecar output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-model-logs
          path: .local/live
          if-no-files-found: ignore
          retention-days: 7
