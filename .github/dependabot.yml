version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /runtime
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /examples/orders
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /examples/inventory
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: ["/docker", "/examples/orders", "/examples/inventory"]
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
