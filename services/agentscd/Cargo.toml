[package]
name = "agentscd"
description = "The agentsc sidecar daemon: app API, mesh (mTLS), runtime supervision, authz, guardrails, budgets, audit (CONTRACT.md §2, §4, §5, §6)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "agentscd"
path = "src/lib.rs"

[[bin]]
name = "agentscd"
path = "src/main.rs"

# The standalone model gateway (docs/LLM-CONNECTION.md).
[[bin]]
name = "agentsc-gateway"
path = "src/bin/agentsc-gateway.rs"

[dependencies]
agentsc-proto.workspace = true
agentsc-charter.workspace = true
agentsc-common.workspace = true
agentsc-pki.workspace = true
agentsc-otel.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
prost.workspace = true
hyper-util.workspace = true
tower.workspace = true
axum.workspace = true
reqwest.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
shell-words.workspace = true
futures.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
url.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
sha2.workspace = true
hex.workspace = true
serde_yaml_ng.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
# Hot reload (design §6.2): the loaded charter and the workload certificate are swapped whole.
arc-swap = "1"
# The mesh and the control-plane connections run rustls themselves, so the certificate can be
# swapped after a renewal (design §6.3); tonic links the same tokio-rustls.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
# CPU sampling for flamegraphs, off by default: --features profiling, then AGENTSC_PROFILE=<prefix>.
pprof = { version = "0.15", default-features = false, features = ["flamegraph"], optional = true }

[features]
profiling = ["dep:pprof"]

[dev-dependencies]
tempfile.workspace = true
serde_yaml_ng.workspace = true
rcgen.workspace = true
time = "0.3"
# A plain HTTP/1 client over the model gateway's unix socket (tests/model_gateway.rs).
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
