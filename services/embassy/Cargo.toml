[package]
name = "embassy"
description = "attache control plane: CA, certificate issuance, Connect, REST/SSE API and UI (CONTRACT.md §5, §7; docs/design/agent-platform.md §7-§10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
attache-pki.workspace = true
attache-common.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
base64.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-util.workspace = true
# Lock-free current serving certificate and config (renewals and reloads without a restart).
arc-swap = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
# B3b (Kubernetes + CA): IssueCertificate, the admission webhooks, the kubernetes store.
attache-proto.workspace = true
attache-charter.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
futures.workspace = true
axum.workspace = true
http.workspace = true
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower.workspace = true
x509-parser.workspace = true
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "admission"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "v1_32"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
rcgen.workspace = true
