[package]
name = "embassy"
description = "agentsc control plane: CA, certificate issuance, Connect, REST/SSE API and UI (CONTRACT.md §5, §7; docs/design/agent-platform.md §7-§10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
agentsc-pki.workspace = true
agentsc-common.workspace = true
agentsc-ledger.workspace = true
agentsc-charter.workspace = true
agentsc-proto.workspace = true
tonic.workspace = true
prost.workspace = true
axum.workspace = true
http.workspace = true
tower.workspace = true
tokio-stream.workspace = true
futures.workspace = true
uuid.workspace = true
# The Connect listener and --http-tls accept TLS here with the serving certificate's rustls
# configuration (the tokio-rustls tonic uses, so client certificates reach the requests).
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
# Session cookies (HMAC-SHA256, design §8.3) and constant-time token and MAC comparison.
hmac = "0.13"
subtle = "2"
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
base64.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-util.workspace = true
# Lock-free current serving certificate and config (renewals and reloads without a restart).
arc-swap = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
# B3b (Kubernetes + CA): IssueCertificate, the admission webhooks, the kubernetes store.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
x509-parser.workspace = true
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs", "admission"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "v1_32"] }
# Conditional GETs (ETag / 304, docs/adr/0002-response-caching.md) read response bodies and
# their size hints; the HTTP/3 bridge streams them frame by frame.
bytes = "1"
http-body = "1"
http-body-util = "0.1"
# `--store sqlite:<path>` (docs/adr/0003-sqlite-store-schema.md): one embedded database with the
# schema in src/store/schema.sql. `bundled` compiles SQLite in, so the image needs no system
# library.
rusqlite = { version = "0.41", features = ["bundled"] }
# `--store postgres` (store/postgres.rs): the client, a pool per replica, and the system roots
# for `sslmode=require` (TLS through tokio-rustls above, no other TLS stack).
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
rustls-native-certs = "0.8"
# `--http3` (docs/adr/0001-http3-for-the-console.md): QUIC with the serving certificate's rustls
# configuration (aws-lc-rs), HTTP/3 framing by h3. Optional: `--no-default-features` builds without.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

[features]
default = ["http3"]
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
