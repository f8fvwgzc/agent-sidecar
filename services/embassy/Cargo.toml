[package]
name = "embassy"
description = "attache control plane: CA, certificate issuance, Connect, REST/SSE API and UI (CONTRACT.md §5, §7; docs/design/agent-platform.md §7-§10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
attache-pki.workspace = true
attache-common.workspace = true
attache-charter.workspace = true
attache-proto.workspace = true
tonic.workspace = true
prost.workspace = true
axum.workspace = true
http.workspace = true
tower.workspace = true
tokio-stream.workspace = true
futures.workspace = true
uuid.workspace = true
# The Connect listener and --http-tls accept TLS here with the serving certificate's rustls
# configuration (the tokio-rustls tonic uses, so client certificates reach the requests).
tokio-rustls = { version = "0.26", default-features = false }
# Session cookies (HMAC-SHA256, design §8.3) and constant-time token and MAC comparison.
hmac = "0.12"
subtle = "2"
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
base64.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-util.workspace = true
# Lock-free current serving certificate and config (renewals and reloads without a restart).
arc-swap = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
